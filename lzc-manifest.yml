application:
  subdomain: networking-toolbox
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://networking-toolbox:3000/
services:
  networking-toolbox:
    # upstream: docker.io/lissy93/networking-toolbox:1.6.0
    image: docker.1ms.run/lissy93/networking-toolbox:1.6.0
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
